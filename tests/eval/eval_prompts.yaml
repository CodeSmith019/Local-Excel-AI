# Evaluation Prompts for Local LLM Excel AI
# Tier 1: 15 cases, Tier 2: 13 cases, Tier 3: 12 cases, Unsupported: 3 cases. Total: 43 cases.
# Expected values hand-calculated from section 12 fixture data.

