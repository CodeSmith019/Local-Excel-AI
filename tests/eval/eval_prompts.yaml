# ==============================================================================

- id: t1_headers_camel
  tier: 1
  fixture: employees.xlsx
  instruction: "Convert all the column headers to camelCase"
  expected_op: convert_case_style
  expected:
    A1: empId
    B1: fullName
    C1: department
    G1: joinDate
  must_not_change: ["A2:J11"]

