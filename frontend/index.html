<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="20" height="20" rx="4" fill="#107C41"/>
            <path d="M5.5 5.5L8.5 10L5.5 14.5H7.5L9.5 11.2L11.5 14.5H13.5L10.5 10L13.5 5.5H11.5L9.5 8.8L7.5 5.5H5.5Z" fill="white"/>
          </svg>
        </div>
        <h1 class="brand-title">Excel AI</h1>
      </div>

      <div class="header-center">
        <!-- Status indicators -->
        <div class="status-group" role="status" aria-label="Connection Status">
          <div class="status-indicator" id="modelStatus" tabindex="0" title="Checking model status...">
            <span class="status-dot dot-offline" id="modelDot" aria-hidden="true"></span>
            <span class="status-label">Model</span>
          </div>
          <div class="status-indicator" id="excelStatus" tabindex="0" title="Checking Excel connection...">
            <span class="status-dot dot-offline" id="excelDot" aria-hidden="true"></span>
            <span class="status-label">Excel</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button id="headerUndoBtn" class="btn btn-secondary btn-sm" title="Undo last change in Excel" aria-label="Undo last change">
          <svg class="btn-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M4.5 3.5A5.5 5.5 0 0 1 14 7.5a.75.75 0 0 1-1.5 0 4 4 0 0 0-6.9-2.76L7.78 6.9A.75.75 0 0 1 7.25 8.2h-4.5A.75.75 0 0 1 2 7.45V2.95a.75.75 0 0 1 1.28-.53l1.22 1.08Z"/>
          </svg>
          <span>Undo</span>
        </button>
      </div>
    </header>

    <!-- Main Chat Log -->
    <main id="chatLog" class="chat-log" role="log" aria-label="Conversation history">
      <!-- Welcome message -->
      <div class="message-card message-assistant welcome-card">
        <div class="message-header">
          <span class="assistant-name">Excel AI</span>
        </div>
        <div class="message-body">
          <p>Tell me what you'd like to do with the active sheet, or pick an example below.</p>
        </div>
      </div>
    </main>

    <!-- Live Working Status Region -->
    <div id="liveStatusContainer" class="live-status-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Input Footer -->
    <footer class="app-footer">
      <form id="chatForm" class="chat-form" onsubmit="return false;">
        <div class="input-wrapper">
          <textarea
            id="promptInput"
            class="chat-input"
            rows="2"
            placeholder="Type an instruction for Excel... (Enter to send, Shift+Enter for newline)"
            aria-label="Instruction for Excel"
          ></textarea>
          <button type="submit" id="sendBtn" class="btn-send" aria-label="Send instruction" title="Send (Enter)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M1.59 1.15a.75.75 0 0 1 .82-.12l12 6a.75.75 0 0 1 0 1.34l-12 6A.75.75 0 0 1 1.3 13.5l1.6-4.8 6.6-0.7-6.6-0.7-1.6-4.8a.75.75 0 0 1 .29-.85Z"/>
            </svg>
          </button>
        </div>
      </form>

      <!-- Example chips -->
      <div class="example-chips" role="group" aria-label="Example instructions">
        <button type="button" class="chip" data-instruction="Convert headers to camelCase">Convert headers to camelCase</button>
        <button type="button" class="chip" data-instruction="Trim spaces in Full Name">Trim spaces in Full Name</button>
        <button type="button" class="chip" data-instruction="Make Department uppercase">Make Department uppercase</button>
        <button type="button" class="chip" data-instruction="Keep only digits in Phone">Keep only digits in Phone</button>
      </div>
    </footer>
  </div>

  <script src="vendor/office/office.js"></script>
  <script src="app.js"></script>
</body>
</html>
