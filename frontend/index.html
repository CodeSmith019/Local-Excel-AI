<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel AI</title>
    <style>
        :root {
            --bg-color: #f7f9fb;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --code-bg: #0f172a;
            --code-color: #38bdf8;
            --accent: #2563eb;
            --success: #16a34a;
            --error: #dc2626;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 2rem;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .badge.online {
            background-color: #dcfce7;
            color: var(--success);
        }
        .badge.offline {
            background-color: #fee2e2;
            color: var(--error);
        }
        pre {
            background-color: var(--code-bg);
            color: var(--code-color);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .refresh-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .refresh-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel AI</h1>
        <p>Health check status from <code>/api/health</code>:</p>
        <pre id="output">Loading health status...</pre>
        <button class="refresh-btn" onclick="fetchHealth()">Refresh</button>
    </div>

    <script>
        async function fetchHealth() {
            const output = document.getElementById("output");
            try {
                const response = await fetch("/api/health");
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = "Error fetching health: " + err.message;
            }
        }
        fetchHealth();
    </script>
</body>
</html>
